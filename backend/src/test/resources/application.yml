spring:
  datasource:
    url: jdbc:h2:mem:enderecocerto-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

security:
