spring:
  application:
    name: enderecocerto-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:enderecocerto}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-troque-em-producao-dev-secret-troque}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

viacep:
  base-url: ${VIACEP_BASE_URL:https://viacep.com.br/ws}
  cache-ttl-minutes: ${VIACEP_CACHE_TTL_MINUTES:60}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

server:
  port: ${PORT:8080}
